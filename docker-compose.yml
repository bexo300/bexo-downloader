
# File 5: docker-compose.yml
docker_compose = '''# Bexo Downloader - Docker Compose Configuration
# Production-ready setup with health checks and restart policies

version: "3.9"

services:
  bexo-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: bexo-downloader
    restart: unless-stopped
    
    # Environment variables
    env_file:
      - .env
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Volumes for persistence
    volumes:
      - ./bot/downloads:/app/bot/downloads
      - ./bot/logs:/app/bot/logs
      - ./bot/database:/app/bot/database
      - ./bot/cache:/app/bot/cache
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Security
    security_opt:
      - no-new-privileges:true
    read_only: false
    
    # Networks
    networks:
      - bexo-network

  # Optional: Redis for caching (uncomment if needed)
  # redis:
  #   image: redis:7-alpine
  #   container_name: bexo-redis
  #   restart: unless-stopped
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - bexo-network

networks:
  bexo-network:
    driver: bridge

# Optional volumes
# volumes:
#   redis-data:
'''

with open("/mnt/agents/output/bexo_downloader/docker-compose.yml", "w", encoding="utf-8") as f:
    f.write(docker_compose)

print("✅ docker-compose.yml created")
